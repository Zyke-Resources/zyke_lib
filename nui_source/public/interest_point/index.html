<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&display=swap" rel="stylesheet" />
		<title>zyke_lib interest point</title>
		<style>
			/* Rendered into a DUI texture that Lua draws on the world point every frame. The page height
			   in 1080p pixels comes in the URL and 1rem is 10 of them, so the layout matches the design in rem */
			:root {
				--dark: 17, 19, 21;
				--page-height: 6.4;
				font-size: calc(100vh / var(--page-height));
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: transparent;
			}

			body {
				font-family: "Barlow Semi Condensed", "Rubik", system-ui, Helvetica, Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			/* Slot 0 renders this collapsed state in a 6.4rem square for every idle ring, so swapping a ring
			   for an expanding slot is invisible. The centre sits 3.2rem from the left edge, where Lua
			   anchors the texture on the point */
			.marker {
				position: absolute;
				top: 50%;
				left: 3.2rem;
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				min-width: 2rem;
				height: 2rem;
				padding: 0;
				background: rgba(var(--dark), 0.35);
				background-clip: padding-box;
				border: 0.2rem solid rgba(255, 255, 255, 0.9);
				border-radius: 1rem;
				transform: translate(-50%, -50%);
				transition:
					min-width 0.18s ease-out,
					height 0.18s ease-out,
					padding 0.18s ease-out,
					border-radius 0.18s ease-out,
					border-color 0.18s ease-out,
					border-width 0.18s ease-out,
					background-color 0.18s ease-out;
			}

			/* The ring fills in white and grows into a plain button, so its dot melts into the fill */
			.marker.active {
				min-width: 2.2rem;
				height: 2.2rem;
				padding: 0 0.5rem;
				background: rgba(245, 245, 245, 0.96);
				border-color: rgba(245, 245, 245, 0.96);
				border-radius: 0.3rem;
			}

			.dot {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 1.1rem;
				height: 1.1rem;
				background: rgba(255, 255, 255, 0.95);
				border-radius: 50%;
				transform: translate(-50%, -50%) scale(1);
				transition: opacity 0.12s ease-out, transform 0.15s ease-out;
			}

			.marker.active .dot {
				opacity: 0;
				transform: translate(-50%, -50%) scale(1.6);
			}

			.key {
				max-width: 0;
				overflow: hidden;
				color: rgb(var(--dark));
				font-size: 1.6rem;
				font-weight: 700;
				line-height: 1;
				text-transform: uppercase;
				white-space: nowrap;
				opacity: 0;
				transition: max-width 0.18s ease-out, opacity 0.12s ease-out;
			}

			.marker.active .key {
				max-width: 10rem;
				opacity: 1;
				transition-delay: 0.05s;
			}

			/* Hangs off the marker's right edge, so it follows the kbd as it grows */
			.label {
				position: absolute;
				top: 50%;
				left: calc(100% + 0.8rem);
				margin: 0;
				color: rgba(255, 255, 255, 0.96);
				font-size: 1.6rem;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.01em;
				text-transform: uppercase;
				white-space: nowrap;
				/* A hard drop, a tight edge and a wide glow for bright backgrounds. The DUI texture thins out
				   soft translucent pixels, so these are much stronger than they would look in a browser */
				text-shadow:
					0 0.15rem 0 rgba(0, 0, 0, 0.8),
					0 0 0.3rem rgba(0, 0, 0, 1),
					0 0 0.8rem rgba(0, 0, 0, 0.9),
					0 0 1.4rem rgba(0, 0, 0, 0.8);
				opacity: 0;
				transform: translate(-0.6rem, -50%);
				transition: opacity 0.15s ease-out, transform 0.18s ease-out;
			}

			.marker.active .label {
				opacity: 1;
				transform: translate(0, -50%);
			}

			/* Sits under the label, which stays centred on the marker; the page is only 6.4rem tall, so
			   the glow is tighter than the label's to stay inside the texture */
			.hint {
				position: absolute;
				top: calc(50% + 1.05rem);
				left: calc(100% + 0.8rem);
				margin: 0;
				color: rgba(255, 255, 255, 0.86);
				font-size: 1.21rem;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.02em;
				text-transform: uppercase;
				white-space: nowrap;
				text-shadow:
					0 0.1rem 0 rgba(0, 0, 0, 0.8),
					0 0 0.25rem rgba(0, 0, 0, 1),
					0 0 0.6rem rgba(0, 0, 0, 0.9);
				opacity: 0;
				transform: translateX(-0.6rem);
				transition: opacity 0.15s ease-out, transform 0.18s ease-out;
			}

			.hint:empty {
				display: none;
			}

			.marker.active .hint {
				opacity: 1;
				transform: translateX(0);
				transition-delay: 0.04s;
			}

			/* A point with options swaps the label and hint for this timeline. It spans the page height
			   centred on the marker and every option is placed from the selected one, which stays beside
			   the key; the mask fades the rows and the track out together towards the texture edges */
			.marker.multi .label,
			.marker.multi .hint {
				display: none;
			}

			.timeline {
				position: absolute;
				top: 50%;
				left: calc(100% + 0.8rem);
				display: none;
				width: 48rem;
				height: 100vh;
				opacity: 0;
				transform: translate(-0.6rem, -50%);
				transition: opacity 0.15s ease-out, transform 0.18s ease-out;
				-webkit-mask-image: linear-gradient(
					to bottom,
					transparent calc(50% - 11rem),
					rgba(0, 0, 0, 0.4) calc(50% - 8rem),
					black calc(50% - 3.4rem),
					black calc(50% + 3.4rem),
					rgba(0, 0, 0, 0.4) calc(50% + 8rem),
					transparent calc(50% + 11rem)
				);
				mask-image: linear-gradient(
					to bottom,
					transparent calc(50% - 11rem),
					rgba(0, 0, 0, 0.4) calc(50% - 8rem),
					black calc(50% - 3.4rem),
					black calc(50% + 3.4rem),
					rgba(0, 0, 0, 0.4) calc(50% + 8rem),
					transparent calc(50% + 11rem)
				);
			}

			.marker.multi .timeline {
				display: block;
			}

			.marker.active .timeline {
				opacity: 1;
				transform: translate(0, -50%);
			}

			.track {
				position: absolute;
				left: 0.27rem;
				width: 0.16rem;
				background: rgba(255, 255, 255, 0.55);
				border-radius: 0.08rem;
				box-shadow: 0 0 0.3rem rgba(0, 0, 0, 0.9);
				transition: top 0.18s ease-out, height 0.18s ease-out;
			}

			.option {
				position: absolute;
				top: 50%;
				left: 0;
				height: 1.6rem;
				/* Scaled around the tick, so the unselected ones stay on the track */
				transform-origin: 0.35rem center;
				transition: transform 0.18s ease-out, opacity 0.18s ease-out;
			}

			.tick {
				position: absolute;
				top: 50%;
				left: 0.35rem;
				width: 0.5rem;
				height: 0.5rem;
				background: rgba(255, 255, 255, 0.85);
				border-radius: 50%;
				box-shadow: 0 0 0.3rem rgba(0, 0, 0, 0.9);
				transform: translate(-50%, -50%);
				transition: width 0.18s ease-out, height 0.18s ease-out, background-color 0.18s ease-out;
			}

			.option.selected .tick {
				width: 0.8rem;
				height: 0.8rem;
				background: rgba(255, 255, 255, 1);
			}

			.option-label {
				position: absolute;
				top: 50%;
				left: 1.1rem;
				margin: 0;
				color: rgba(255, 255, 255, 0.96);
				font-size: 1.6rem;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.01em;
				text-transform: uppercase;
				white-space: nowrap;
				text-shadow:
					0 0.15rem 0 rgba(0, 0, 0, 0.8),
					0 0 0.3rem rgba(0, 0, 0, 1),
					0 0 0.8rem rgba(0, 0, 0, 0.9),
					0 0 1.4rem rgba(0, 0, 0, 0.8);
				transform: translateY(-50%);
			}

			.option-hint {
				position: absolute;
				top: calc(50% + 1.05rem);
				left: 1.1rem;
				margin: 0;
				color: rgba(255, 255, 255, 0.86);
				font-size: 1.21rem;
				font-weight: 700;
				line-height: 1;
				letter-spacing: 0.02em;
				text-transform: uppercase;
				white-space: nowrap;
				text-shadow:
					0 0.1rem 0 rgba(0, 0, 0, 0.8),
					0 0 0.25rem rgba(0, 0, 0, 1),
					0 0 0.6rem rgba(0, 0, 0, 0.9);
				opacity: 0;
				transition: opacity 0.15s ease-out;
			}

			.option.selected .option-hint {
				opacity: 1;
			}

			/* Wraps the marker so the shake moves it without touching its own centring transform */
			.shaker {
				position: absolute;
				inset: 0;
			}

			.shaker.shake {
				animation: shake 0.36s ease-out;
			}

			.shaker.shake .marker.active {
				animation: refuse 0.36s ease-out;
			}

			@keyframes shake {
				0%, 100% { transform: translateX(0); }
				15% { transform: translateX(-0.4rem); }
				35% { transform: translateX(0.35rem); }
				55% { transform: translateX(-0.25rem); }
				75% { transform: translateX(0.12rem); }
			}

			@keyframes refuse {
				0%, 100% { border-color: rgba(245, 245, 245, 0.96); }
				20%, 60% { border-color: rgba(225, 60, 60, 0.96); }
			}

			/* Snaps a reused slot back to the ring before it expands for a new point */
			.instant,
			.instant * {
				transition: none !important;
			}
		</style>
	</head>
	<body>
		<div class="shaker" id="shaker">
			<div class="marker" id="marker">
				<div class="dot"></div>
				<span class="key" id="key"></span>
				<p class="label" id="label"></p>
				<p class="hint" id="hint"></p>
				<div class="timeline" id="timeline">
					<div class="track" id="track"></div>
				</div>
			</div>
		</div>
		<script>
			const shaker = document.getElementById("shaker");
			const marker = document.getElementById("marker");
			const keyEl = document.getElementById("key");
			const labelEl = document.getElementById("label");
			const hintEl = document.getElementById("hint");
			const timelineEl = document.getElementById("timeline");
			const trackEl = document.getElementById("track");
			const params = new URLSearchParams(location.search);
			const slot = Number(params.get("slot"));
			const resName = typeof GetParentResourceName === "function" ? GetParentResourceName() : location.hostname.replace(/^cfx-nui-/, "");
			let wantActive = false;
			let optionEls = [];
			let options = [];
			let selected = 0;

			const pageHeight = Number(params.get("height"));
			if (pageHeight > 0) document.documentElement.style.setProperty("--page-height", String(pageHeight / 10));

			// Rows in rem from the selected option's centre; its hint pushes the options below it down
			const optionPitch = 2.6;
			const hintSpace = 1.3;
			// Unselected options are dimmed; the timeline's mask fades them further with distance
			const unselectedOpacity = 0.75;

			function buildOptions() {
				for (const el of optionEls) el.remove();

				optionEls = options.map((option) => {
					const el = document.createElement("div");
					el.className = "option";
					el.innerHTML = '<span class="tick"></span><p class="option-label"></p><p class="option-hint"></p>';
					el.querySelector(".option-label").textContent = option.label || "";
					el.querySelector(".option-hint").textContent = option.hint || "";
					timelineEl.appendChild(el);

					return el;
				});

				marker.classList.toggle("multi", options.length > 0);
			}

			function placeOptions() {
				if (optionEls.length === 0) return;

				const hintGap = options[selected] && options[selected].hint ? hintSpace : 0;
				const offsets = optionEls.map((_, i) => (i - selected) * optionPitch + (i > selected ? hintGap : 0));

				optionEls.forEach((el, i) => {
					const distance = Math.abs(i - selected);

					el.classList.toggle("selected", distance === 0);
					el.style.opacity = String(distance === 0 ? 1 : unselectedOpacity);
					el.style.transform = `translateY(${offsets[i] - 0.8}rem) scale(${distance === 0 ? 1 : 0.8})`;
				});

				trackEl.style.top = `calc(50% + ${offsets[0]}rem)`;
				trackEl.style.height = `${offsets[offsets.length - 1] - offsets[0]}rem`;
			}

			window.addEventListener("message", (e) => {
				const message = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
				if (!message || message.event !== "SetInterestPoint") return;

				const data = message.data || {};

				// Restarted on every shake, so a second refusal mid-shake still plays in full
				if (data.shake) {
					shaker.classList.remove("shake");
					void shaker.offsetWidth;
					shaker.classList.add("shake");

					return;
				}

				if (data.reset) {
					shaker.classList.remove("shake");
					marker.classList.add("instant");
					marker.classList.remove("active");
					void marker.offsetWidth;
					marker.classList.remove("instant");
				}

				if (data.key !== undefined) keyEl.textContent = data.key || "";
				if (data.label !== undefined) labelEl.textContent = data.label || "";
				if (data.hint !== undefined) hintEl.textContent = data.hint || "";

				// Lua sends the 1-based index of the selected option
				if (typeof data.selected === "number") selected = Math.max(0, data.selected - 1);

				// New rows snap into place rather than sliding in from the anchor
				if (data.options !== undefined) {
					options = Array.isArray(data.options) ? data.options : [];
					selected = Math.min(selected, Math.max(options.length - 1, 0));
					buildOptions();
					timelineEl.classList.add("instant");
					placeOptions();
					void timelineEl.offsetWidth;
					timelineEl.classList.remove("instant");
				} else {
					selected = Math.min(selected, Math.max(options.length - 1, 0));
					placeOptions();
				}

				wantActive = data.active === true;
				if (!wantActive) {
					marker.classList.remove("active");

					return;
				}

				// Two frames so a reset ring is painted before the morph starts
				requestAnimationFrame(() => requestAnimationFrame(() => {
					if (wantActive) marker.classList.add("active");
				}));
			});

			fetch(`https://${resName}/Eventhandler:InterestPoint`, {
				method: "POST",
				headers: { "Content-Type": "application/json; charset=UTF-8" },
				body: JSON.stringify({ event: "Ready", data: { slot } }),
			}).catch(() => {});
		</script>
	</body>
</html>
